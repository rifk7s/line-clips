[project]
name = "line-clips"
version = "0.1.0"
description = "Line clipping app, Computer Graphics assignment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16.10"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
